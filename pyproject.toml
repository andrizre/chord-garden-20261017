[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chord-garden"
version = "1.0.0"
description = "A seed-driven geometric string-art generator that exports SVG."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Andrizre" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Environment :: Console",
  "Topic :: Artistic Software",
]

[project.scripts]
chord-garden = "chordgarden.cli:main"

[tool.setuptools.packages.find]
include = ["chordgarden*"]
